# Netlify: static site, no backend. Connect the repo and Netlify reads everything from here.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 / TypeScript 7 need a current Node.
  NODE_VERSION = "22"

# Single-page app: every route (/ledger, /resident?…, /sim) serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change: cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker and manifest must always be re-checked so updates reach devices.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
